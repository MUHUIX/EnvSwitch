name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release notes
        shell: pwsh
        run: |
          $notes = "releases/${{ github.ref_name }}.md"
          if (-not (Test-Path $notes)) {
            Write-Error "缺少本次版本更新说明：$notes 。每个 v* tag 都必须带一份只描述本次变更的说明文件。"
            exit 1
          }
          Write-Host "本次更新说明：$notes"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci --no-fund --no-audit
          npm run build

      - name: Build binaries
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          $ld = "-s -w -X github.com/HUIdada1/envswitch/internal/core.Version=$ver"
          go build -trimpath -ldflags $ld -o build\bin\envs.exe .\cmd\envs
          go build -tags production -trimpath -ldflags "$ld -H=windowsgui" -o build\bin\EnvSwitch.exe .
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path build\bin\envs.exe, build\bin\EnvSwitch.exe `
            -DestinationPath out\EnvSwitch-win-x64.zip
          Get-FileHash out\EnvSwitch-win-x64.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  EnvSwitch-win-x64.zip" } |
            Set-Content out\SHA256SUMS.txt -Encoding ascii

      - name: Installer (NSIS)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\bin\nsis | Out-Null
          makensis /DVERSION=${{ github.ref_name }} "${{ github.workspace }}\build\nsis\envswitch.nsi"

      - name: Release + update manifest
        uses: softprops/action-gh-release@v2
        with:
          body_path: releases/${{ github.ref_name }}.md
          files: |
            out/EnvSwitch-win-x64.zip
            out/SHA256SUMS.txt
            build/bin/nsis/EnvSwitch-Setup-*.exe

      - name: Publish latest.json to updates branch
        shell: pwsh
        run: |
          $zip = "out/EnvSwitch-win-x64.zip"
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $tag = "${{ github.ref_name }}"
          $notes = Get-Content -Raw "releases/$tag.md"
          $manifest = @{
            version = $tag
            date    = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            notes_zh = $notes
            assets  = @{
              "windows/amd64" = @{
                url    = "https://github.com/HUIdada1/EnvSwitch/releases/download/$tag/EnvSwitch-win-x64.zip"
                sha256 = $sha
                size   = (Get-Item $zip).Length
              }
            }
          } | ConvertTo-Json -Depth 5
          git config user.name "envswitch-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan updates
          git rm -rf . 2>$null | Out-Null
          [IO.File]::WriteAllText("latest.json", $manifest)
          git add latest.json
          git commit -m "release $tag"
          git push -f origin updates
