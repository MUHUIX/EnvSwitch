name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci --no-fund --no-audit
          npm run build

      - name: Build binaries
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          $ld = "-s -w -X github.com/HUIdada1/envswitch/internal/core.Version=$ver"
          go build -trimpath -ldflags $ld -o build\bin\envs.exe .\cmd\envs
          go build -tags production -trimpath -ldflags "$ld -H=windowsgui" -o build\bin\EnvSwitch.exe .
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path build\bin\envs.exe, build\bin\EnvSwitch.exe `
            -DestinationPath out\EnvSwitch-win-x64.zip
          Get-FileHash out\EnvSwitch-win-x64.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  EnvSwitch-win-x64.zip" } |
            Set-Content out\SHA256SUMS.txt -Encoding ascii

      - name: Installer (NSIS)
        run: makensis /DVERSION=${{ github.ref_name }} build\nsis\envswitch.nsi

      - name: Release + update manifest
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/EnvSwitch-win-x64.zip
            out/SHA256SUMS.txt
            build/bin/nsis/EnvSwitch-Setup-*.exe

      - name: Publish latest.json to updates branch
        shell: pwsh
        run: |
          $zip = "out/EnvSwitch-win-x64.zip"
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $tag = "${{ github.ref_name }}"
          $manifest = @{
            version = $tag
            date    = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            notes_zh = "${{ github.event.release.body }}"
            assets  = @{
              "windows/amd64" = @{
                url    = "https://github.com/HUIdada1/EnvSwitch/releases/download/$tag/EnvSwitch-win-x64.zip"
                sha256 = $sha
                size   = (Get-Item $zip).Length
              }
            }
          } | ConvertTo-Json -Depth 5
          git config user.name "envswitch-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan updates
          Remove-Item -Recurse -Force * -ErrorAction SilentlyContinue
          [IO.File]::WriteAllText("latest.json", $manifest)
          git add latest.json
          git commit -m "release $tag"
          git push -f origin updates
